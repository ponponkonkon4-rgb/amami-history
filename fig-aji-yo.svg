<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">按司世のイメージ図 按司とグスク</title>
<desc id="desc">按司が勢力を蓄えグスクが築かれ、百之台に集まったと伝えられる時代を示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">按司とグスクの時代</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="200" height="98" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="130.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">按司（アジ）</text><text x="130.0" y="144" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">各地の首長が</text><text x="130.0" y="165" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">勢力を蓄える</text><line x1="230" y1="120" x2="262" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M262 113 L272 120 L262 127 Z" fill="#0d5c63"/><rect x="270" y="80" width="200" height="98" rx="10" fill="#eef5ef" stroke="#0d5c63" stroke-width="2"/><text x="370.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">グスク</text><text x="370.0" y="144" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">山頂・台地の城</text><text x="370.0" y="165" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">赤木名城跡など</text><line x1="470" y1="120" x2="502" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M502 113 L512 120 L502 127 Z" fill="#0d5c63"/><rect x="510" y="80" width="180" height="98" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="600.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">百之台</text><text x="600.0" y="144" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">喜界島</text><text x="600.0" y="165" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">会議の場と伝承</text><rect x="40" y="190" width="640" height="48" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">階級社会の形成 ― やがて琉球王国の成立へ</text>
</svg>
