<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">明治から敗戦までのイメージ図</title>
<desc id="desc">1879年の大島郡設置、大島商社への専売継承、大島紬と砂糖への依存を示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">県政下でも続いた砂糖の構図</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="200" height="98" rx="10" fill="#ffffff" stroke="#43536a" stroke-width="2"/><text x="130.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">1879年</text><text x="130.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">大島郡が置かれ</text><text x="130.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">鹿児島県の行政下に</text><line x1="230" y1="120" x2="262" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M262 113 L272 120 L262 127 Z" fill="#0d5c63"/><rect x="270" y="80" width="200" height="98" rx="10" fill="#eef5ef" stroke="#43536a" stroke-width="2"/><text x="370.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">大島商社</text><text x="370.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">黒糖の専売体制が</text><text x="370.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">形を変えて継承</text><line x1="470" y1="120" x2="502" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M502 113 L512 120 L502 127 Z" fill="#0d5c63"/><rect x="510" y="80" width="180" height="98" rx="10" fill="#ffffff" stroke="#43536a" stroke-width="2"/><text x="600.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">島の産業</text><text x="600.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">大島紬と砂糖に</text><text x="600.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">依存が続く</text><rect x="40" y="190" width="640" height="48" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">昭和に入ると軍事拠点としても位置づけられた</text>
</svg>
