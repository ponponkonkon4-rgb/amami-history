<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">図解：黒糖はどこへ行ったのか ― 大和世の専売の仕組み</title>
<desc id="desc">島民が生産した黒糖は、1830年の惣買入制で私売が禁じられ、薩摩藩が安値で独占的に買い上げ、大阪の問屋に卸して藩の財政再建に充てた。島民への対価は現金ではなく羽書で、割高な食料・日用品と引き換えられたことを示す流れ図。</desc>
<rect width="1000" height="560" fill="#fbf9f4"/>
<rect x="0" y="0" width="1000" height="120" fill="#083f4d"/>
<text x="500" y="55" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="38" font-weight="bold" fill="#fdfcf8">図解：黒糖はどこへ行ったのか</text>
<text x="500" y="92" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="22" fill="#cfe3dd">大和世 ― 薩摩藩による黒糖専売の仕組み（第4章より）</text>
<rect x="30" y="170" width="205" height="150" rx="12" fill="#ffffff" stroke="#ddd3bd" stroke-width="2"/>
<text x="132" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="bold" fill="#083f4d">サトウキビ栽培</text>
<text x="132" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" fill="#1d2733">島民が黒糖を生産</text>
<text x="132" y="282" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">年貢も黒糖で納入</text>
<text x="132" y="306" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">（換糖上納令）</text>
<path d="M240 245 L268 245" stroke="#b7791f" stroke-width="5"/><path d="M258 232 L272 245 L258 258 Z" fill="#b7791f"/>
<rect x="275" y="170" width="205" height="150" rx="12" fill="#fff7e6" stroke="#b7791f" stroke-width="3"/>
<text x="377" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="bold" fill="#083f4d">薩摩藩が独占買上げ</text>
<text x="377" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" fill="#1d2733">惣買入制（1830年）</text>
<text x="377" y="282" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">私売は禁止</text>
<text x="377" y="306" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">藩が安値で買い上げ</text>
<path d="M485 245 L513 245" stroke="#b7791f" stroke-width="5"/><path d="M503 232 L517 245 L503 258 Z" fill="#b7791f"/>
<rect x="520" y="170" width="205" height="150" rx="12" fill="#ffffff" stroke="#ddd3bd" stroke-width="2"/>
<text x="622" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="bold" fill="#083f4d">大阪の問屋へ</text>
<text x="622" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" fill="#1d2733">黒糖を卸して売却</text>
<text x="622" y="282" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">大きな利潤が生まれた</text>
<path d="M730 245 L758 245" stroke="#b7791f" stroke-width="5"/><path d="M748 232 L762 245 L748 258 Z" fill="#b7791f"/>
<rect x="765" y="170" width="205" height="150" rx="12" fill="#ffffff" stroke="#ddd3bd" stroke-width="2"/>
<text x="867" y="215" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="bold" fill="#083f4d">藩の財政再建へ</text>
<text x="867" y="250" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" fill="#1d2733">約500万両ともいわれる</text>
<text x="867" y="278" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" fill="#1d2733">借財の返済の柱に</text>
<text x="867" y="306" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="19" fill="#43536a">1844年には借財は解消</text>
<rect x="30" y="365" width="940" height="130" rx="12" fill="#0d5c63"/>
<text x="60" y="410" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="bold" fill="#ffd98a">一方、島民のもとには ―</text>
<text x="60" y="448" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" fill="#fdfcf8">対価は現金ではなく「羽書」（商品券的な仕組み）で、割高な食料・日用品と引き換えられた。</text>
<text x="60" y="480" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="21" fill="#fdfcf8">飢饉のたびに、毒抜きを要する蘇鉄を食べて命をつなぐ「蘇鉄地獄」にも苦しんだ。</text>
<text x="500" y="530" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="18" fill="#43536a">内容は本サイト第4章「大和世」に基づきます ／ 運営：太郎JAPAN</text>
</svg>
