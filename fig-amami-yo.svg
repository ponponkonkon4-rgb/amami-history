<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">奄美世のイメージ図 貝の道</title>
<desc id="desc">九州と南の島々を結ぶゴホウラ交易の中継点だった奄美と、御嶽を中心とする集落を示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">貝の道 ― 海で結ばれた島々</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#5a8a72" stroke-width="2"/><text x="120.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">九州</text><text x="120.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">本土との交流</text><line x1="210" y1="120" x2="242" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M242 113 L252 120 L242 127 Z" fill="#0d5c63"/><rect x="250" y="80" width="220" height="90" rx="10" fill="#eef5ef" stroke="#0d5c63" stroke-width="2"/><text x="360.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">奄美大島</text><text x="360.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">交易の中継点</text><text x="360.0" y="170" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">ゴホウラ（巻貝）</text><line x1="470" y1="120" x2="502" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M502 113 L512 120 L502 127 Z" fill="#0d5c63"/><rect x="510" y="80" width="180" height="90" rx="10" fill="#ffffff" stroke="#5a8a72" stroke-width="2"/><text x="600.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">南の島々</text><text x="600.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">沖縄方面</text><rect x="40" y="190" width="640" height="52" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">御嶽を中心に集落（シマ） ― 血縁で助け合う共同体</text>
</svg>
