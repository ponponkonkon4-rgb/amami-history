<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">終章のイメージ図 奄美のアイデンティティ</title>
<desc id="desc">結い、ノロとユタ、島唄と大島紬が島の足場を支えたことを示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">島の足場を支えた三つ</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="130.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">結い</text><text x="130.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">労働力を融通する</text><text x="130.0" y="170" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">相互扶助</text><rect x="260" y="80" width="200" height="90" rx="10" fill="#eef5ef" stroke="#0d5c63" stroke-width="2"/><text x="360.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">ノロとユタ</text><text x="360.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">祭祀と民間の祈り</text><text x="360.0" y="170" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">心の支え</text><rect x="490" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="590.0" y="118" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">島唄と大島紬</text><text x="590.0" y="146" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">歌い継ぎ、技を磨く</text><text x="590.0" y="170" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">文化と経済</text><rect x="40" y="190" width="640" height="52" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">どこにも完全には属さなかった経験 ― それが、しなやかな強さに</text>
</svg>
