<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">那覇世のイメージ図 段階的な編入</title>
<desc id="desc">1429年から1466年にかけて奄美群島が段階的に琉球王国へ編入された流れを示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">琉球王国への段階的な編入</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="180" height="98" rx="10" fill="#ffffff" stroke="#2a7a9b" stroke-width="2"/><text x="120.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">1429年</text><text x="120.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">沖永良部島</text><text x="120.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">与論島が編入</text><line x1="210" y1="120" x2="242" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M242 113 L252 120 L242 127 Z" fill="#0d5c63"/><rect x="250" y="80" width="200" height="98" rx="10" fill="#eef5ef" stroke="#2a7a9b" stroke-width="2"/><text x="350.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">1447年</text><text x="350.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">奄美大島が</text><text x="350.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">統治下に入る</text><line x1="450" y1="120" x2="482" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M482 113 L492 120 L482 127 Z" fill="#0d5c63"/><rect x="490" y="80" width="200" height="98" rx="10" fill="#ffffff" stroke="#2a7a9b" stroke-width="2"/><text x="590.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">1466年</text><text x="590.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">喜界島が陥落</text><text x="590.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">尚徳王の親征</text><rect x="40" y="190" width="640" height="48" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">間切による間接支配 ／ ノロの制度が根づく</text>
</svg>
