<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title desc">
<title id="title">復帰から現代のイメージ図</title>
<desc id="desc">復興特別措置法、黒糖焼酎への転回、2021年の世界自然遺産登録を示す図。</desc>
<rect width="720" height="240" fill="#fbf9f4"/>
<text x="360" y="42" text-anchor="middle" font-family="'Hiragino Mincho ProN','Yu Mincho',serif" font-size="26" font-weight="bold" fill="#083f4d">苦しめた黒糖が、島の特産へ</text><line x1="60" y1="60" x2="660" y2="60" stroke="#b7791f" stroke-width="3"/><rect x="30" y="80" width="180" height="98" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="120.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">1954年</text><text x="120.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">復興特別措置法</text><text x="120.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">基盤整備が進む</text><line x1="210" y1="120" x2="242" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M242 113 L252 120 L242 127 Z" fill="#0d5c63"/><rect x="250" y="80" width="200" height="98" rx="10" fill="#eef5ef" stroke="#0d5c63" stroke-width="2"/><text x="350.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">黒糖焼酎</text><text x="350.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">奄美群島でのみ</text><text x="350.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">製造が認められる</text><line x1="450" y1="120" x2="482" y2="120" stroke="#0d5c63" stroke-width="3"/><path d="M482 113 L492 120 L482 127 Z" fill="#0d5c63"/><rect x="490" y="80" width="200" height="98" rx="10" fill="#ffffff" stroke="#0d5c63" stroke-width="2"/><text x="590.0" y="115" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="bold" fill="#083f4d">2021年</text><text x="590.0" y="140" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">世界自然遺産に登録</text><text x="590.0" y="161" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="15" fill="#43536a">アマミノクロウサギ</text><rect x="40" y="190" width="640" height="48" rx="10" fill="#0d5c63"/><text x="360" y="223" text-anchor="middle" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" fill="#fdfcf8">2017年 奄美群島国立公園誕生 ― 境界の地理が世界の宝に</text>
</svg>
